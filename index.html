<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE - Custom Rooms & Earn Cash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gaming: { dark: '#0a0e17', card: '#121826', border: '#1e293b', accent: '#00ff88', pink: '#ff0055', gold: '#ffaa00' }
                    },
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], rajdhani: ['Rajdhani', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0e17; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; }
        .heading-font { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-gaming-accent selection:text-black">

    <!-- NAVIGATION HEADER -->
    <header class="sticky top-0 z-40 bg-gaming-dark/95 border-b border-gaming-border backdrop-blur-md px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('tournaments')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-gaming-pink to-gaming-accent p-0.5 flex items-center justify-center">
                    <div class="w-full h-full bg-gaming-dark rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-fire-flame-curved text-gaming-pink text-xl"></i>
                    </div>
                </div>
                <div>
                    <h1 class="heading-font font-black text-xl text-white">BOOYAH<span class="text-gaming-accent">ZONE</span></h1>
                </div>
            </div>

            <!-- User Balance & Auth Buttons -->
            <div class="flex items-center gap-2.5" id="auth-header-section">
                <!-- Will render dynamically based on login status -->
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <section id="tab-tournaments" class="space-y-6">
            <div class="bg-gaming-card p-6 rounded-2xl border border-gaming-border text-center space-y-3">
                <h2 class="heading-font text-2xl font-bold text-white">Welcome to Booyah Zone</h2>
                <p class="text-xs text-gray-400">Play Free Fire custom rooms, watch ads, and earn real cash!</p>
            </div>
            <div id="tournaments-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Matches -->
            </div>
        </section>
    </main>

    <!-- MODAL: LOGIN / SIGN UP -->
    <div id="modal-auth" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-gaming-card border border-gaming-border rounded-2xl max-w-md w-full p-6 space-y-4 relative text-xs">
            <button onclick="closeModal('modal-auth')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <!-- Tabs Toggle -->
            <div class="flex bg-gaming-dark p-1 rounded-xl border border-gaming-border font-bold">
                <button onclick="switchAuthMode('login')" id="auth-tab-login" class="w-1/2 py-2 rounded-lg bg-gaming-accent text-black transition-all">Login</button>
                <button onclick="switchAuthMode('signup')" id="auth-tab-signup" class="w-1/2 py-2 rounded-lg text-gray-400 hover:text-white transition-all">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3 pt-2">
                <h3 class="heading-font text-base font-bold text-white">Login to your Account</h3>
                <div>
                    <label class="block text-gray-400 mb-1">Mobile Number / Email</label>
                    <input type="text" id="login-username" required placeholder="Enter mobile or email" class="w-full bg-gaming-dark border border-gaming-border rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="********" class="w-full bg-gaming-dark border border-gaming-border rounded-xl p-2.5 text-white">
                </div>
                <button type="submit" class="w-full bg-gaming-accent text-black font-bold py-2.5 rounded-xl">Login Now</button>
            </form>

            <!-- SIGN UP FORM -->
            <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-3 pt-2 hidden">
                <h3 class="heading-font text-base font-bold text-white">Create New Account</h3>
                <div>
                    <label class="block text-gray-400 mb-1">In-Game Name (IGN)</label>
                    <input type="text" id="signup-ign" required placeholder="e.g. OP_PLAYER" class="w-full bg-gaming-dark border border-gaming-border rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Free Fire UID</label>
                    <input type="text" id="signup-uid" required placeholder="e.g. 19283049" class="w-full bg-gaming-dark border border-gaming-border rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Mobile Number</label>
                    <input type="text" id="signup-mobile" required placeholder="10-digit mobile number" class="w-full bg-gaming-dark border border-gaming-border rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Password</label>
                    <input type="password" id="signup-password" required placeholder="Create password" class="w-full bg-gaming-dark border border-gaming-border rounded-xl p-2.5 text-white">
                </div>
                <button type="submit" class="w-full bg-gaming-pink text-white font-bold py-2.5 rounded-xl">Create Account & Get ₹50</button>
            </form>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gaming-card border border-gaming-accent text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-gaming-accent"></i>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        let appState = {
            currentUser: JSON.parse(localStorage.getItem('bz_logged_user')) || null,
            usersDb: JSON.parse(localStorage.getItem('bz_users_db')) || []
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateAuthHeader();
        });

        function updateAuthHeader() {
            const container = document.getElementById('auth-header-section');
            if (appState.currentUser) {
                container.innerHTML = `
                    <div class="flex items-center gap-2 bg-gaming-card border border-gaming-border px-3 py-1.5 rounded-xl">
                        <i class="fa-solid fa-wallet text-gaming-gold"></i>
                        <span class="text-xs font-bold text-gaming-gold">₹${appState.currentUser.wallet.toFixed(2)}</span>
                    </div>
                    <button onclick="handleLogout()" class="bg-red-500/20 border border-red-500/40 text-red-400 text-xs font-bold px-3 py-1.5 rounded-xl">Logout</button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openAuthModal('login')" class="bg-gaming-accent text-black text-xs font-bold px-4 py-2 rounded-xl">Login</button>
                    <button onclick="openAuthModal('signup')" class="bg-gaming-pink text-white text-xs font-bold px-4 py-2 rounded-xl">Sign Up</button>
                `;
            }
        }

        function openAuthModal(mode) {
            switchAuthMode(mode);
            document.getElementById('modal-auth').classList.remove('hidden');
        }

        function switchAuthMode(mode) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('auth-tab-login');
            const tabSignup = document.getElementById('auth-tab-signup');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "w-1/2 py-2 rounded-lg bg-gaming-accent text-black transition-all font-bold";
                tabSignup.className = "w-1/2 py-2 rounded-lg text-gray-400 hover:text-white transition-all";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.className = "w-1/2 py-2 rounded-lg bg-gaming-pink text-white transition-all font-bold";
                tabLogin.className = "w-1/2 py-2 rounded-lg text-gray-400 hover:text-white transition-all";
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const ign = document.getElementById('signup-ign').value;
            const uid = document.getElementById('signup-uid').value;
            const mobile = document.getElementById('signup-mobile').value;
            const password = document.getElementById('signup-password').value;

            const existing = appState.usersDb.find(u => u.mobile === mobile);
            if (existing) {
                showToast("Mobile number already registered!");
                return;
            }

            const newUser = { ign, uid, mobile, password, wallet: 50.00, adsWatched: 0, joinedMatchIds: [] };
            appState.usersDb.push(newUser);
            appState.currentUser = newUser;

            localStorage.setItem('bz_users_db', JSON.stringify(appState.usersDb));
            localStorage.setItem('bz_logged_user', JSON.stringify(newUser));

            closeModal('modal-auth');
            updateAuthHeader();
            showToast("Account created successfully! ₹50 added.");
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const user = appState.usersDb.find(u => u.mobile === username || u.ign === username);
            if (!user || user.password !== password) {
                showToast("Invalid credentials! Please check.");
                return;
            }

            appState.currentUser = user;
            localStorage.setItem('bz_logged_user', JSON.stringify(user));

            closeModal('modal-auth');
            updateAuthHeader();
            showToast("Logged in successfully!");
        }

        function handleLogout() {
            appState.currentUser = null;
            localStorage.removeItem('bz_logged_user');
            updateAuthHeader();
            showToast("Logged out successfully!");
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
