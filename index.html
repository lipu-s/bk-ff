<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BK FF Esports - Free Fire Tournaments</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glow-card { border: 1px solid #30363d; background: #161b22; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        .accent-bg { background: linear-gradient(135deg, #238636 0%, #2ea043 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-green-400 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-gamepad"></i> BK FF ESPORTS
            </h1>
            <button onclick="openAdminModal()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-1 px-3 rounded border border-gray-700">
                <i class="fa-solid fa-lock text-yellow-400 mr-1"></i> Admin
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        <div class="mb-6 text-center">
            <h2 class="text-2xl font-extrabold text-white mb-1">Live Tournaments</h2>
            <p class="text-sm text-gray-400">Join daily Free Fire rooms & win rewards!</p>
        </div>

        <!-- Matches Container (Synced from Firebase) -->
        <div id="matches-list" class="grid gap-4 md:grid-cols-2">
            <div class="glow-card p-6 rounded-xl text-center text-gray-400 animate-pulse">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-green-400"></i>
                <p>Loading active matches...</p>
            </div>
        </div>
    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Login View -->
            <div id="admin-login-view">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-green-400"></i> Admin Authentication
                </h3>
                <input type="password" id="admin-pin" placeholder="Enter Secret PIN (Default: 1234)" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white mb-4 focus:outline-none focus:border-green-500">
                <button onclick="verifyAdmin()" class="w-full accent-bg text-white font-bold py-3 rounded-lg hover:opacity-90 transition">Login to Panel</button>
            </div>

            <!-- Control View -->
            <div id="admin-control-view" class="hidden">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-sliders text-green-400"></i> Match Manager</span>
                    <button onclick="logoutAdmin()" class="text-xs text-red-400 underline">Logout</button>
                </h3>
                <form id="match-form" onsubmit="saveMatch(event)" class="space-y-3">
                    <input type="text" id="m-title" placeholder="Match Title (e.g. Solo Bermuda #10)" required class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="m-time" placeholder="Time (e.g. 8:00 PM)" required class="bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white">
                        <input type="text" id="m-fee" placeholder="Entry Fee (e.g. ₹20)" required class="bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white">
                    </div>
                    <input type="text" id="m-prize" placeholder="Prize Pool (e.g. ₹200)" required class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="m-roomid" placeholder="Room ID" class="bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white">
                        <input type="text" id="m-pass" placeholder="Room Pass" class="bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full accent-bg text-white font-bold py-2.5 rounded text-sm hover:opacity-90 transition">Publish / Update Match</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 p-4 text-center text-xs text-gray-500">
        &copy; 2026 BK FF Esports. All rights reserved.
    </footer>

    <!-- Firebase SDK Scripts (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZZpUFjvLgpR8Bx41zRTOD05hPt5lG2bE",
            authDomain: "bk-fft.firebaseapp.com",
            databaseURL: "https://bk-fft-default-rtdb.firebaseio.com",
            projectId: "bk-fft",
            storageBucket: "bk-fft.firebasestorage.app",
            messagingSenderId: "670932523757",
            appId: "1:670932523757:web:26e918428a106798e20ae4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for Realtime Match Updates
        db.ref('matches').on('value', (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('matches-list');
            container.innerHTML = '';

            if(!data) {
                container.innerHTML = `<div class="col-span-full glow-card p-6 rounded-xl text-center text-gray-400">No active matches found. Check back soon!</div>`;
                return;
            }

            Object.keys(data).forEach(key => {
                const match = data[key];
                const card = `
                    <div class="glow-card p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="font-bold text-white text-lg">${match.title}</h3>
                                <span class="text-xs bg-green-900/50 text-green-400 border border-green-700/50 px-2.5 py-0.5 rounded-full">ACTIVE</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs text-gray-300 mb-4 bg-gray-900/60 p-3 rounded-lg border border-gray-800/80">
                                <div><i class="fa-regular fa-clock text-green-400 mr-1"></i> ${match.time}</div>
                                <div><i class="fa-solid fa-ticket text-yellow-400 mr-1"></i> Fee: ${match.fee}</div>
                                <div><i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Prize: ${match.prize}</div>
                            </div>
                        </div>
                        <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex justify-between items-center text-xs">
                            <div>
                                <span class="text-gray-400 block">Room Details:</span>
                                <span class="text-white font-mono">ID: ${match.roomid || 'Will update soon'}</span> | 
                                <span class="text-white font-mono">Pass: ${match.pass || '***'}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        });

        // Admin Auth logic
        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
        
        function verifyAdmin() {
            const pin = document.getElementById('admin-pin').value;
            if(pin === '1234') { // Secret PIN
                document.getElementById('admin-login-view').classList.add('hidden');
                document.getElementById('admin-control-view').classList.remove('hidden');
            } else {
                alert('Wrong PIN!');
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-login-view').classList.remove('hidden');
            document.getElementById('admin-control-view').classList.add('hidden');
            document.getElementById('admin-pin').value = '';
        }

        function saveMatch(e) {
            e.preventDefault();
            const matchData = {
                title: document.getElementById('m-title').value,
                time: document.getElementById('m-time').value,
                fee: document.getElementById('m-fee').value,
                prize: document.getElementById('m-prize').value,
                roomid: document.getElementById('m-roomid').value,
                pass: document.getElementById('m-pass').value,
                updatedAt: Date.now()
            };

            db.ref('matches/main_match').set(matchData)
                .then(() => {
                    alert('Match Updated Successfully!');
                    closeAdminModal();
                })
                .catch(err => alert('Error saving: ' + err.message));
        }

        // Auto open admin modal if URL hash is #admin
        if(window.location.hash === '#admin') { openAdminModal(); }
    </script>
</body>
</html>
